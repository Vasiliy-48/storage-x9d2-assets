<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Zone Optical Modem</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #121212; color: white; text-align: center; }
        .card { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        
        /* Зона передачи - 5 полос */
        #transmitter { 
            display: flex; width: 100%; height: 250px; 
            border: 5px solid #333; border-radius: 15px; overflow: hidden; margin: 20px 0;
            background: black;
        }
        .zone { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; color: #444; font-size: 14px; border-right: 1px solid #111;
        }
        #syncZone { border-left: 2px solid #000; border-right: 2px solid #000; }

        textarea { width: 100%; height: 70px; border-radius: 10px; padding: 10px; border: none; margin: 10px 0; box-sizing: border-box; font-size: 18px; background: #2b2b2b; color: white;}
        button { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 18px;}
        .btn-send { background: #007aff; color: white; }
        .btn-rx { background: #34c759; color: white; }

        /* Зона приема */
        .video-wrap { position: relative; width: 100%; display: none; margin-top: 15px; border-radius: 15px; overflow: hidden; }
        video { width: 100%; background: #000; }
        
        /* Прицел на 5 точек */
        .target-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: space-around; pointer-events: none;
        }
        .dot { 
            width: 15px; height: 15px; border: 2px solid red; border-radius: 50%; 
            background: rgba(255,0,0,0.3); color: white; font-size: 9px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .dot.sync { border-color: #00ff00; background: rgba(0,255,0,0.3); width: 20px; height: 20px;}

        #rxText { background: #000; color: #0f0; font-family: monospace; height: 100px; width: 100%; margin-top: 15px; border-radius: 10px; padding: 10px; box-sizing: border-box; font-size: 18px; border: 1px solid #333;}
        
        /* Индикаторы под камерой */
        .indicators { display: flex; justify-content: space-around; margin: 15px 0; }
        .ind { width: 35px; height: 35px; border: 2px solid #555; border-radius: 8px; font-size: 10px; display: flex; align-items: center; justify-content: center; background: black;}
    </style>
</head>
<body>

<div class="card">
    <div style="color: #666; font-size: 12px;">5-ZONE SLOW MODEM (4 bits/tick)</div>

    <textarea id="txText" placeholder="Введите текст...">HELLO</textarea>
    <button class="btn-send" onclick="transmit()">ОТПРАВИТЬ (МЕДЛЕННО)</button>
    
    <div id="transmitter">
        <div id="z0" class="zone">B0</div>
        <div id="z1" class="zone">B1</div>
        <div id="sync" class="zone" style="color:#888">SYNC</div>
        <div id="z2" class="zone">B2</div>
        <div id="z3" class="zone">B3</div>
    </div>

    <button class="btn-rx" id="btnCam" onclick="initCamera()">ВКЛЮЧИТЬ ПРИЕМНИК</button>
    
    <div id="rxSection" style="display:none;">
        <div class="video-wrap" id="vWrap">
            <video id="video" playsinline></video>
            <div class="target-overlay">
                <div class="dot">0</div>
                <div class="dot">1</div>
                <div class="dot sync">S</div>
                <div class="dot">2</div>
                <div class="dot">3</div>
            </div>
        </div>
        
        <div class="indicators">
            <div id="ind0" class="ind">0</div>
            <div id="ind1" class="ind">1</div>
            <div id="indS" class="ind">S</div>
            <div id="ind2" class="ind">2</div>
            <div id="ind3" class="ind">3</div>
        </div>

        <p style="font-size: 12px;">Порог яркости:</p>
        <input type="range" id="threshold" min="0" max="255" value="130" style="width:100%">
        <textarea id="rxText" readonly placeholder="Результат..."></textarea>
    </div>
</div>

<script>
    // СТАВИМ МЕДЛЕННУЮ СКОРОСТЬ (300мс на вспышку)
    const TICK_SPEED = 300; 
    let currentSync = false;

    async function transmit() {
        const text = document.getElementById('txText').value;
        const zones = [
            document.getElementById('z0'),
            document.getElementById('z1'),
            document.getElementById('z2'),
            document.getElementById('z3')
        ];
        const sZone = document.getElementById('sync');
        
        // Перевод в биты
        let allBits = "";
        for (let char of text) {
            allBits += char.charCodeAt(0).toString(2).padStart(8, '0');
        }

        // 1. Стартовый сигнал (все белое)
        zones.forEach(z => z.style.background = 'white');
        sZone.style.background = 'white';
        await new Promise(r => setTimeout(r, 1000));

        // 2. Цикл передачи по 4 бита за раз
        for (let i = 0; i < allBits.length; i += 4) {
            const chunk = allBits.substring(i, i + 4).padEnd(4, '0');
            
            // Устанавливаем 4 зоны данных
            for (let j = 0; j < 4; j++) {
                zones[j].style.background = chunk[j] === '1' ? 'white' : 'black';
            }
            
            // Инвертируем SYNC (каждый шаг он меняет цвет)
            currentSync = !currentSync;
            sZone.style.background = currentSync ? 'white' : 'black';
            
            await new Promise(r => setTimeout(r, TICK_SPEED));
        }

        // Конец - всё в черный
        zones.forEach(z => z.style.background = 'black');
        sZone.style.background = 'black';
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').play();
            document.getElementById('rxSection').style.display = 'block';
            document.getElementById('vWrap').style.display = 'block';
            document.getElementById('btnCam').style.display = 'none';
            decode();
        } catch (e) { alert("Ошибка камеры"); }
    }

    function decode() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const rxText = document.getElementById('rxText');
        
        let lastSyncState = -1;
        let bitBuffer = "";

        const loop = () => {
            if (video.readyState === 4) {
                canvas.width = 100; canvas.height = 100;
                // Кропаем видео (узкая горизонтальная полоска в центре)
                ctx.drawImage(video, 0, video.videoHeight*0.45, video.videoWidth, video.videoHeight*0.1, 0, 0, 100, 100);
                
                const thresh = document.getElementById('threshold').value;
                const getVal = (x) => {
                    const d = ctx.getImageData(x, 50, 1, 1).data;
                    return ((d[0]+d[1]+d[2])/3) > thresh ? 1 : 0;
                };

                // Читаем 5 точек (10%, 30%, 50%, 70%, 90% ширины)
                const b0 = getVal(10);
                const b1 = getVal(30);
                const bS = getVal(50);
                const b2 = getVal(70);
                const b3 = getVal(90);

                // Визуализация
                const updateInd = (id, val) => {
                    const el = document.getElementById(id);
                    el.style.background = val ? 'white' : 'black';
                    el.style.color = val ? 'black' : 'white';
                };
                updateInd('ind0', b0); updateInd('ind1', b1);
                updateInd('indS', bS); updateInd('ind2', b2); updateInd('ind3', b3);

                // Логика по изменению SYNC
                if (lastSyncState !== -1 && bS !== lastSyncState) {
                    // Собираем 4 бита
                    bitBuffer += b0.toString() + b1.toString() + b2.toString() + b3.toString();
                    
                    if (bitBuffer.length >= 8) {
                        const charCode = parseInt(bitBuffer.substring(0, 8), 2);
                        if (charCode >= 32 && charCode <= 126) {
                            rxText.value += String.fromCharCode(charCode);
                        }
                        bitBuffer = bitBuffer.substring(8);
                    }
                }
                lastSyncState = bS;
            }
            requestAnimationFrame(loop);
        };
        loop();
    }
</script>
</body>
</html>
