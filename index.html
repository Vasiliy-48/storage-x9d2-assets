<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Modem v6.0 - PRO Tuning</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #000; color: #fff; text-align: center; }
        .card { max-width: 600px; margin: 0 auto; background: #111; padding: 15px; border-radius: 20px; border: 1px solid #333; }
        
        /* Тюнинг-панель */
        .tuning { background: #1a1a1a; padding: 10px; border-radius: 12px; margin-bottom: 15px; text-align: left; border: 1px solid #333;}
        .tuning label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-top: 8px; }
        input[type="range"] { width: 100%; margin-top: 5px; }

        /* Передатчик */
        #txContainer { display: flex; justify-content: center; align-items: center; min-height: 320px; background: #050505; border-radius: 12px; margin-bottom: 10px; border: 1px solid #222;}
        #transmitter { 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            width: 250px; height: 250px; gap: 15px; background: #000; padding: 15px; border-radius: 8px;
        }
        .cell { background: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #222; font-weight: bold; font-size: 14px;}
        #cell-4 { border: 2px solid #333; }

        textarea { width: 100%; height: 60px; border-radius: 10px; padding: 10px; border: none; margin: 5px 0; background: #222; color: #fff; font-size: 16px; box-sizing: border-box;}
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 16px; background: #007aff; color: #fff; }
        .btn-green { background: #34c759; }
        .btn-gray { background: #444; }

        /* Приемник (Квадрат 300x300) */
        .video-wrap { 
            position: relative; width: 300px; height: 300px; margin: 10px auto; 
            border-radius: 16px; overflow: hidden; border: 2px solid #555; display: none; background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .target-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .dot { position: absolute; width: 16px; height: 16px; border: 2px solid red; border-radius: 50%; background: rgba(255,0,0,0.3); transform: translate(-50%, -50%); }
        .dot.sync { border-color: #0f0; width: 22px; height: 22px; }

        #rxText { background: #000; color: #0f0; font-family: monospace; height: 80px; width: 100%; margin-top: 10px; border-radius: 10px; padding: 10px; font-size: 18px; border: 1px solid #333; box-sizing: border-box;}
        .monitor { display: grid; grid-template-columns: repeat(3, 15px); gap: 5px; justify-content: center; margin: 10px 0; }
        .m-cell { width: 15px; height: 15px; border: 1px solid #444; background: #000; border-radius: 3px;}
    </style>
</head>
<body>

<div class="card">
    <div id="status" style="color: #007aff; font-size: 14px; font-weight: bold;">v6.0 PRO: ADJUSTABLE GRID</div>

    <!-- Тюнинг Передатчика -->
    <div class="tuning">
        <strong style="font-size:14px;">🛠 Настройки Передатчика (TX)</strong>
        <label>Размер матрицы: <span id="l-txSize">250px</span></label>
        <input type="range" id="txSize" min="150" max="350" value="250" oninput="updateTx()">
        <label>Защита от засветов (Толщина границ): <span id="l-txGap">15px</span></label>
        <input type="range" id="txGap" min="2" max="40" value="15" oninput="updateTx()">
    </div>

    <textarea id="txText">HELLO</textarea>
    <button onclick="transmit()">ОТПРАВИТЬ ДАННЫЕ</button>
    
    <div id="txContainer">
        <div id="transmitter">
            <div id="cell-0" class="cell">0</div><div id="cell-1" class="cell">1</div><div id="cell-2" class="cell">2</div>
            <div id="cell-3" class="cell">3</div><div id="cell-4" class="cell" style="color:#555">S</div><div id="cell-5" class="cell">5</div>
            <div id="cell-6" class="cell">6</div><div id="cell-7" class="cell">7</div><div id="cell-8" class="cell" style="color:#00ffff">P</div>
        </div>
    </div>

    <hr style="border: 1px solid #222; margin: 20px 0;">

    <!-- Тюнинг Приемника -->
    <div class="tuning">
        <strong style="font-size:14px;">🎯 Настройки Приемника (RX)</strong>
        <label>Масштаб прицела (Раздвинуть точки): <span id="l-rxScale">80px</span></label>
        <input type="range" id="rxScale" min="30" max="130" value="80" oninput="updateRx()">
        <label>Порог яркости (Чувствительность): <span id="l-rxThresh">130</span></label>
        <input type="range" id="rxThresh" min="10" max="250" value="130" oninput="updateRx()">
    </div>

    <div style="display: flex; gap: 8px;">
        <button class="btn-green" style="flex: 2;" onclick="initCamera()">ВКЛЮЧИТЬ СКАНЕР</button>
        <button class="btn-gray" style="flex: 1;" onclick="switchCamera()">КАМЕРА 🔄</button>
    </div>
    
    <div id="rxSection" style="display:none;">
        <div class="video-wrap" id="vWrap">
            <video id="video" playsinline></video>
            <div class="target-overlay" id="overlay">
                <!-- Точки генерируются в JS -->
            </div>
        </div>
        
        <div class="monitor" id="monitor">
            <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div>
            <div class="m-cell"></div><div class="m-cell" style="border-color:#0f0"></div><div class="m-cell"></div>
            <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell" style="border-color:#0ff"></div>
        </div>

        <div style="font-size: 12px; color: #ff3b30; margin-bottom: 5px; font-weight: bold;">
            Ошибок (Битые байты): <span id="errCount">0</span>
        </div>
        <textarea id="rxText" readonly></textarea>
        <button class="btn-gray" onclick="document.getElementById('rxText').value=''; errors=0; document.getElementById('errCount').innerText='0';">Очистить</button>
    </div>
</div>

<script>
    const TICK_MS = 450; 
    let camIndex = 0;
    let currentStream = null;
    let errors = 0;

    const DATA_CELLS =[0, 1, 2, 3, 5, 6, 7];
    const PARITY_CELL = 8;
    const SYNC_CELL = 4;

    // --- ОБНОВЛЕНИЕ UI ---
    function updateTx() {
        const size = document.getElementById('txSize').value;
        const gap = document.getElementById('txGap').value;
        document.getElementById('l-txSize').innerText = size + "px";
        document.getElementById('l-txGap').innerText = gap + "px";
        const tx = document.getElementById('transmitter');
        tx.style.width = size + "px";
        tx.style.height = size + "px";
        tx.style.gap = gap + "px";
        tx.style.padding = gap + "px";
    }

    function updateRx() {
        const scale = parseInt(document.getElementById('rxScale').value);
        document.getElementById('l-rxScale').innerText = scale + "px";
        document.getElementById('l-rxThresh').innerText = document.getElementById('rxThresh').value;
        
        // Перерисовываем точки прицела
        const overlay = document.getElementById('overlay');
        overlay.innerHTML = '';
        const coords = [-scale, 0, scale];
        for(let y of coords) {
            for(let x of coords) {
                const dot = document.createElement('div');
                dot.className = (x === 0 && y === 0) ? 'dot sync' : 'dot';
                dot.style.left = `calc(50% + ${x}px)`;
                dot.style.top = `calc(50% + ${y}px)`;
                overlay.appendChild(dot);
            }
        }
    }
    
    // Инициализация при загрузке
    updateTx(); updateRx();

    // --- ПЕРЕДАЧА ---
    async function transmit() {
        const text = document.getElementById('txText').value;
        const allCells = Array.from({length: 9}, (_, i) => document.getElementById(`cell-${i}`));
        
        // Преамбула
        allCells.forEach(c => c.style.background = "white");
        await new Promise(r => setTimeout(r, 1200));
        allCells.forEach(c => c.style.background = "black");
        await new Promise(r => setTimeout(r, 800));

        for (let char of text) {
            let code = char.charCodeAt(0) & 127;
            let bits = code.toString(2).padStart(7, '0').split('').map(Number);
            let parity = bits.reduce((a, b) => a ^ b, 0);

            // Данные
            allCells[SYNC_CELL].style.background = "black";
            bits.forEach((bit, i) => allCells[DATA_CELLS[i]].style.background = bit ? "white" : "black");
            allCells[PARITY_CELL].style.background = parity ? "white" : "black";
            await new Promise(r => setTimeout(r, TICK_MS));

            // Синхронизация (Считывание)
            allCells[SYNC_CELL].style.background = "white";
            await new Promise(r => setTimeout(r, TICK_MS));
        }
        allCells.forEach(c => c.style.background = "black");
    }

    // --- КАМЕРА И ПРИЕМ ---
    async function switchCamera() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        camIndex = (camIndex + 1) % cams.length;
        initCamera(cams[camIndex].deviceId);
    }

    async function initCamera(deviceId = null) {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        const constraints = deviceId ? { video: { deviceId: { exact: deviceId } } } : { video: { facingMode: 'environment' } };
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('video').srcObject = currentStream;
            document.getElementById('video').play();
            document.getElementById('rxSection').style.display = 'block';
            document.getElementById('vWrap').style.display = 'block';
            decode();
        } catch (e) { alert("Камера недоступна"); }
    }

    function decode() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const rxText = document.getElementById('rxText');
        const errDisp = document.getElementById('errCount');
        const mCells = document.getElementById('monitor').children;
        
        let waitRising = true;

        const loop = () => {
            if (video.readyState === 4) {
                // Холст жестко 300x300, как и окно просмотра
                canvas.width = 300; canvas.height = 300;
                
                // Вырезаем ровный квадрат из центра видеопотока
                const size = Math.min(video.videoWidth, video.videoHeight);
                const startX = (video.videoWidth - size) / 2;
                const startY = (video.videoHeight - size) / 2;
                ctx.drawImage(video, startX, startY, size, size, 0, 0, 300, 300);
                
                const thresh = parseInt(document.getElementById('rxThresh').value);
                const scale = parseInt(document.getElementById('rxScale').value);
                
                // Функция считывания пикселя в координатах (x, y)
                const getBit = (x, y) => {
                    // Берем не 1 пиксель, а усредняем область 3x3 для надежности
                    const d = ctx.getImageData(x-1, y-1, 3, 3).data;
                    let sum = 0;
                    for(let i=0; i<d.length; i+=4) sum += (d[i]+d[i+1]+d[i+2])/3;
                    return (sum/9) > thresh ? 1 : 0;
                };

                // Координаты выборки от центра (150, 150)
                const center = 150;
                const offsets = [-scale, 0, scale];
                let bits =[];
                for(let dy of offsets) {
                    for(let dx of offsets) {
                        bits.push(getBit(center + dx, center + dy));
                    }
                }

                // Обновляем мониторчик
                bits.forEach((b, i) => mCells[i].style.background = b ? "white" : "black");

                const sBit = bits[SYNC_CELL];

                if (waitRising && sBit === 1) {
                    const dataBits = DATA_CELLS.map(i => bits[i]);
                    const parityRec = bits[PARITY_CELL];
                    const parityCalc = dataBits.reduce((a, b) => a ^ b, 0);

                    if (parityCalc === parityRec) {
                        const code = parseInt(dataBits.join(''), 2);
                        if (code >= 32) rxText.value += String.fromCharCode(code);
                    } else {
                        errors++; errDisp.innerText = errors;
                        rxText.value += "░";
                    }
                    waitRising = false;
                } else if (sBit === 0) {
                    waitRising = true;
                }
            }
            requestAnimationFrame(loop);
        };
        loop();
    }
</script>
</body>
</html>
