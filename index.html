<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Optical Modem v5.0</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; background: #000; color: #fff; text-align: center; }
        .card { max-width: 500px; margin: 0 auto; background: #111; padding: 15px; border-radius: 24px; border: 1px solid #333; }
        
        /* Сетка передачи 3x3 */
        #transmitter { 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            width: 300px; height: 300px; margin: 20px auto;
            border: 4px solid #444; border-radius: 12px; overflow: hidden; background: #000;
        }
        .cell { border: 1px solid #111; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #222; transition: background 0.05s; }
        #cell-4 { background: #222; border: 2px solid #000; } /* Центр - SYNC */

        textarea { width: 100%; height: 60px; border-radius: 12px; padding: 12px; border: none; margin: 10px 0; background: #222; color: #fff; font-size: 16px; box-sizing: border-box;}
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 16px; background: #007aff; color: #fff; }
        
        .video-wrap { position: relative; width: 100%; max-width: 400px; margin: 10px auto; border-radius: 20px; overflow: hidden; display: none; border: 2px solid #444; }
        video { width: 100%; background: #000; }
        
        /* Прицел-сетка */
        .grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            pointer-events: none;
        }
        .grid-dot { display: flex; align-items: center; justify-content: center; }
        .dot { width: 14px; height: 14px; border: 2px solid red; border-radius: 50%; background: rgba(255,0,0,0.2); }
        .dot.sync { border-color: #0f0; width: 20px; height: 20px; }

        #rxText { background: #000; color: #0f0; font-family: monospace; height: 80px; width: 100%; margin-top: 10px; border-radius: 12px; padding: 10px; font-size: 18px; border: 1px solid #333; box-sizing: border-box;}
        .monitor { display: grid; grid-template-columns: repeat(3, 12px); gap: 5px; justify-content: center; margin: 10px 0; }
        .m-cell { width: 12px; height: 12px; border: 1px solid #444; background: #000; }
    </style>
</head>
<body>

<div class="card">
    <div id="status" style="color: #007aff; font-size: 12px; font-weight: bold;">v5.0 MATRIX GRID MODEM</div>

    <textarea id="txText">HELLO</textarea>
    <button onclick="transmit()">ОТПРАВИТЬ МАТРИЦЕЙ</button>
    
    <div id="transmitter">
        <div id="cell-0" class="cell"></div><div id="cell-1" class="cell"></div><div id="cell-2" class="cell"></div>
        <div id="cell-3" class="cell"></div><div id="cell-4" class="cell">S</div><div id="cell-5" class="cell"></div>
        <div id="cell-6" class="cell"></div><div id="cell-7" class="cell"></div><div id="cell-8" class="cell">P</div>
    </div>

    <div style="display: flex; gap: 8px;">
        <button style="background: #34c759; flex: 2;" onclick="initCamera()">ПРИЕМНИК</button>
        <button style="background: #444; flex: 1;" onclick="switchCamera()">КАМЕРА 🔄</button>
    </div>
    
    <div id="rxSection" style="display:none;">
        <div class="video-wrap" id="vWrap">
            <video id="video" playsinline></video>
            <div class="grid-overlay">
                <div class="grid-dot"><div class="dot"></div></div><div class="grid-dot"><div class="dot"></div></div><div class="grid-dot"><div class="dot"></div></div>
                <div class="grid-dot"><div class="dot"></div></div><div class="grid-dot"><div class="dot sync"></div></div><div class="grid-dot"><div class="dot"></div></div>
                <div class="grid-dot"><div class="dot"></div></div><div class="grid-dot"><div class="dot"></div></div><div class="grid-dot"><div class="dot"></div></div>
            </div>
        </div>
        
        <div class="monitor" id="monitor">
            <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div>
            <div class="m-cell"></div><div class="m-cell" style="border-color:#0f0"></div><div class="m-cell"></div>
            <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell" style="border-color:#0ff"></div>
        </div>

        <div style="font-size: 11px; color: #555; margin-bottom: 5px;">
            Ошибок CRC: <span id="errCount" style="color:#ff3b30">0</span> | Порог: <span id="curThresh">120</span>
        </div>
        <textarea id="rxText" readonly></textarea>
        <button onclick="document.getElementById('rxText').value=''" style="background:#222; font-size:12px; padding:8px;">Очистить</button>
    </div>
</div>

<script>
    const TICK_MS = 450; 
    let camIndex = 0;
    let lockedThresh = 120;
    let currentStream = null;

    // Порядок ячеек данных (пропуская центральную 4)
    const DATA_CELLS = [0, 1, 2, 3, 5, 6, 7]; // 7 бит данных
    const PARITY_CELL = 8;
    const SYNC_CELL = 4;

    async function transmit() {
        const text = document.getElementById('txText').value;
        const allCells = Array.from({length: 9}, (_, i) => document.getElementById(`cell-${i}`));
        
        // Преамбула (Handshake)
        allCells.forEach(c => c.style.background = "white");
        await new Promise(r => setTimeout(r, 1200));
        allCells.forEach(c => c.style.background = "black");
        await new Promise(r => setTimeout(r, 800));

        for (let char of text) {
            let code = char.charCodeAt(0) & 127;
            let bits = code.toString(2).padStart(7, '0').split('').map(Number);
            let parity = bits.reduce((a, b) => a ^ b, 0);

            // Sync OFF
            allCells[SYNC_CELL].style.background = "black";
            bits.forEach((bit, i) => allCells[DATA_CELLS[i]].style.background = bit ? "white" : "black");
            allCells[PARITY_CELL].style.background = parity ? "white" : "black";
            await new Promise(r => setTimeout(r, TICK_MS));

            // Sync ON
            allCells[SYNC_CELL].style.background = "white";
            await new Promise(r => setTimeout(r, TICK_MS));
        }
        allCells.forEach(c => c.style.background = "black");
    }

    async function switchCamera() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        camIndex = (camIndex + 1) % cams.length;
        initCamera(cams[camIndex].deviceId);
    }

    async function initCamera(deviceId = null) {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        const constraints = deviceId ? { video: { deviceId: { exact: deviceId } } } : { video: { facingMode: 'environment' } };
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('video').srcObject = currentStream;
            document.getElementById('video').play();
            document.getElementById('rxSection').style.display = 'block';
            document.getElementById('vWrap').style.display = 'block';
            decode();
        } catch (e) { alert("Камера недоступна"); }
    }

    function decode() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const rxText = document.getElementById('rxText');
        const errDisp = document.getElementById('errCount');
        const mCells = document.getElementById('monitor').children;
        
        let waitRising = true;
        let errors = 0;

        const loop = () => {
            if (video.readyState === 4) {
                canvas.width = 100; canvas.height = 100;
                // Кропаем центральный квадрат кадра
                ctx.drawImage(video, video.videoWidth*0.25, video.videoHeight*0.25, video.videoWidth*0.5, video.videoHeight*0.5, 0, 0, 100, 100);
                
                const thresh = document.getElementById('threshold')?.value || 120;
                
                const getBit = (x, y) => {
                    const d = ctx.getImageData(x, y, 1, 1).data;
                    const b = (d[0]+d[1]+d[2])/3;
                    return b > thresh ? 1 : 0;
                };

                // Сетка координат 3x3 на холсте 100x100
                const coords = [20, 50, 80];
                let bits = [];
                for(let y of coords) for(let x of coords) bits.push(getBit(x, y));

                // Мониторинг
                bits.forEach((b, i) => mCells[i].style.background = b ? "white" : "black");

                const sBit = bits[SYNC_CELL];

                if (waitRising && sBit === 1) {
                    const dataBits = DATA_CELLS.map(i => bits[i]);
                    const parityRec = bits[PARITY_CELL];
                    const parityCalc = dataBits.reduce((a, b) => a ^ b, 0);

                    if (parityCalc === parityRec) {
                        const code = parseInt(dataBits.join(''), 2);
                        if (code >= 32) rxText.value += String.fromCharCode(code);
                    } else {
                        errors++; errDisp.innerText = errors;
                        rxText.value += "░";
                    }
                    waitRising = false;
                } else if (sBit === 0) {
                    waitRising = true;
                }
            }
            requestAnimationFrame(loop);
        };
        loop();
    }
</script>
<!-- Скрытый ползунок порога для тонкой настройки если надо -->
<input type="range" id="threshold" min="0" max="255" value="120" style="display:none">
</body>
</html>
