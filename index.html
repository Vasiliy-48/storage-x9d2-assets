<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Modem Pro</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; text-align: center; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 24px; }
        textarea { width: 100%; height: 100px; border: 2px solid #ddd; border-radius: 12px; padding: 12px; box-sizing: border-box; font-size: 16px; margin: 15px 0; }
        button { width: 100%; padding: 16px; background: #007aff; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        #flashArea { width: 100%; height: 150px; background: black; border-radius: 12px; margin-top: 15px; display: flex; align-items: center; justify-content: center; color: #555; border: 2px solid #eee; }
        .video-wrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; display: none; margin-top: 15px; }
        video { width: 100%; background: #000; transform: scaleX(-1); }
        .target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 2px solid red; pointer-events: none; border-radius: 4px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; background: #e1f5fe; color: #01579b; font-weight: bold; margin-bottom: 10px; }
        #perceived { width: 50px; height: 50px; border-radius: 50%; border: 4px solid #333; margin: 15px auto; background: black; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔦 Оптический Модем</h1>
    <div id="status" class="status-badge">Готов к работе</div>
    
    <!-- СЕКЦИЯ ОТПРАВКИ -->
    <textarea id="txText" placeholder="Введи текст (English)...">HELLO</textarea>
    <button onclick="transmit()">ОТПРАВИТЬ СВЕТОМ</button>
    <div id="flashArea">ЭКРАН-ИЗЛУЧАТЕЛЬ</div>
    
    <div style="margin: 30px 0; border-top: 1px solid #eee;"></div>

    <!-- СЕКЦИЯ ПРИЕМА -->
    <button id="btnCam" style="background: #34c759;" onclick="initCamera()">ВКЛЮЧИТЬ ПРИЕМНИК</button>
    
    <div id="rxSection" style="display:none;">
        <div class="video-wrap" id="vWrap">
            <video id="video" playsinline></video>
            <div class="target"></div>
        </div>
        <p>Порог чувствительности:</p>
        <input type="range" id="threshold" min="0" max="255" value="140" style="width: 100%;">
        <div id="perceived"></div>
        <p>Получено:</p>
        <textarea id="rxText" readonly placeholder="Тут появится текст..."></textarea>
    </div>
</div>

<script>
    const BIT_TIME = 150; 
    const statusDiv = document.getElementById('status');

    // ПЕРЕДАЧА
    async function transmit() {
        const text = document.getElementById('txText').value.toUpperCase();
        if(!text) return;
        const area = document.getElementById('flashArea');
        const bits = Array.from(text).map(c => (c.charCodeAt(0) & 255).toString(2).padStart(8, '0')).join('');
        
        statusDiv.innerText = "ИДЕТ ПЕРЕДАЧА...";
        statusDiv.style.background = "#fff9c4";

        for (let i = 0; i < bits.length; i += 8) {
            let byte = bits.substring(i, i+8);
            // Start bit
            area.style.backgroundColor = 'white'; await new Promise(r => setTimeout(r, BIT_TIME));
            // Data bits
            for (let bit of byte) {
                area.style.backgroundColor = bit === '1' ? 'white' : 'black';
                await new Promise(r => setTimeout(r, BIT_TIME));
            }
            // Stop bits
            area.style.backgroundColor = 'black'; await new Promise(r => setTimeout(r, BIT_TIME * 2));
        }
        area.style.backgroundColor = 'black';
        statusDiv.innerText = "ГОТОВО";
        statusDiv.style.background = "#e1f5fe";
    }

    // ПРИЕМ
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const video = document.getElementById('video');
            video.srcObject = stream;
            video.play();
            document.getElementById('rxSection').style.display = 'block';
            document.getElementById('vWrap').style.display = 'block';
            document.getElementById('btnCam').style.display = 'none';
            process();
        } catch (e) { alert("Камера недоступна. Убедитесь, что дали разрешение!"); }
    }

    function process() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let rxState = 'IDLE', bits = [], lastL = 0, nextS = 0;

        const loop = () => {
            if (video.readyState === 4) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                const imgData = ctx.getImageData(canvas.width/2-5, canvas.height/2-5, 10, 10).data;
                let bright = 0;
                for(let i=0; i<imgData.length; i+=4) bright += (imgData[i]+imgData[i+1]+imgData[i+2])/3;
                bright /= (imgData.length/4);

                const isL = bright > document.getElementById('threshold').value ? 1 : 0;
                document.getElementById('perceived').style.backgroundColor = isL ? 'white' : 'black';

                const now = performance.now();
                if (rxState === 'IDLE' && lastL === 0 && isL === 1) {
                    rxState = 'READ'; bits = []; nextS = now + (BIT_TIME * 1.5);
                    statusDiv.innerText = "ПРИЕМ ДАННЫХ...";
                } else if (rxState === 'READ' && now >= nextS) {
                    bits.push(isL); nextS += BIT_TIME;
                    if (bits.length === 8) {
                        const charCode = parseInt(bits.join(''), 2);
                        document.getElementById('rxText').value += String.fromCharCode(charCode);
                        rxState = 'IDLE'; statusDiv.innerText = "ЖДУ СИГНАЛ";
                    }
                }
                lastL = isL;
            }
            requestAnimationFrame(loop);
        };
        loop();
    }
</script>
</body>
</html>
