<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Photo (Web Version)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Убираем скроллбары */
            background-color: #151515; /* Цвет фона страницы (резервный) */
        }
        canvas {
            display: block; /* Убираем отступы канваса */
        }
    </style>
    <!-- Подключаем Three.js через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

<script type="module">
    import * as THREE from 'three';

    // --- 1. НАСТРОЙКА СЦЕНЫ (Аналог View3D и SceneEnvironment) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#252527'); // clearColor из QML

    // --- 2. КАМЕРА (Аналог PerspectiveCamera) ---
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 40); // Начальная позиция Z = 40

    // --- 3. РЕНДЕРЕР (Движок отрисовки) ---
    const renderer = new THREE.WebGLRenderer({ antialias: true }); // antialiasingMode
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 4. ОСВЕЩЕНИЕ (Аналог DirectionalLight) ---
    const light = new THREE.DirectionalLight(0xffffff, 1.5); // brightness: 1.5
    // В QML вращение (-30, -30, 0). В Three.js задаем позицию, откуда светит свет.
    light.position.set(-5, 10, 10); 
    scene.add(light);
    
    // Добавим немного AmbientLight, чтобы тени не были абсолютно черными
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // --- 5. ЗАГРУЗКА ФОТО И СОЗДАНИЕ ОБЪЕКТА ---
    
    // Ссылка на фото. Можете заменить на локальный путь './photo.jpg'
    const imageSource = './photo.jpg'; 
    
    const textureLoader = new THREE.TextureLoader();
    
    // Группа, которая будет содержать нашу "карточку" (аналог Node id: photoNode)
    const photoNode = new THREE.Group();
    scene.add(photoNode);

    textureLoader.load(
        imageSource,
        (texture) => {
            // Callback, когда фото загрузилось (аналог onStatusChanged)
            
            // Считаем пропорции
            const imgWidth = texture.image.width;
            const imgHeight = texture.image.height;
            const aspectRatio = imgWidth / imgHeight;

            // Размеры (аналог свойств h, w, d)
            const h = 15.0;
            const w = h * aspectRatio;
            const d = 0.5;

            // Настройка текстуры (цветовое пространство)
            texture.colorSpace = THREE.SRGBColorSpace;

            // --- МАТЕРИАЛЫ ---
            // В QML было 3 модели. В Three.js проще сделать один BoxGeometry с массивом материалов.
            // Порядок материалов в BoxGeometry: [Right, Left, Top, Bottom, Front, Back]
            
            // Материал для торцов (roughness: 0.8)
            const sideMaterial = new THREE.MeshStandardMaterial({ 
                map: texture, 
                roughness: 0.8,
                color: 0xffffff
            });

            // Материал для переда и зада (roughness: 0.2)
            const faceMaterial = new THREE.MeshStandardMaterial({ 
                map: texture, 
                roughness: 0.2,
                color: 0xffffff
            });

            const materials = [
                sideMaterial, // Right
                sideMaterial, // Left
                sideMaterial, // Top
                sideMaterial, // Bottom
                faceMaterial, // Front
                faceMaterial  // Back
            ];

            // --- ГЕОМЕТРИЯ ---
            const geometry = new THREE.BoxGeometry(w, h, d);
            
            // Создаем Меш
            const mesh = new THREE.Mesh(geometry, materials);
            
            // В QML задняя часть поворачивалась на 180. 
            // В BoxGeometry текстура на грани Back по умолчанию может быть перевернута зеркально.
            // Если нужно, можно настроить UV координаты, но для простоты оставим стандарт.
            
            photoNode.add(mesh);
        },
        undefined, // onProgress
        (err) => { console.error('Ошибка загрузки текстуры', err); }
    );

    // --- 6. УПРАВЛЕНИЕ (Аналог MouseArea) ---
    let isDragging = false;
    let lastPos = { x: 0, y: 0 };

    // Обработка нажатия
    window.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastPos = { x: e.clientX, y: e.clientY };
    });

    // Обработка отпускания
    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // Обработка движения (Вращение объекта)
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const dx = e.clientX - lastPos.x;
        const dy = e.clientY - lastPos.y;

        // В QML: photoNode.eulerRotation.y += dx * 0.5
        // В Three.js вращение в радианах. Подбираем коэффициент чувствительности.
        const sensitivity = 0.01;
        
        photoNode.rotation.y += dx * sensitivity;
        photoNode.rotation.x += dy * sensitivity;

        lastPos = { x: e.clientX, y: e.clientY };
    });

    // Обработка колесика (Зум камеры)
    window.addEventListener('wheel', (e) => {
        // e.deltaY возвращает значение прокрутки (обычно +/- 100)
        // В QML: wheel.angleDelta.y * 0.05. Тут подстроим под браузер.
        
        const zoomSpeed = 0.05;
        let newZ = camera.position.z + (e.deltaY * zoomSpeed);

        // Ограничения (clamp)
        if (newZ < 10) newZ = 10;
        if (newZ > 100) newZ = 100;

        camera.position.z = newZ;
    });

    // Обработка изменения размера окна
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. АНИМАЦИОННЫЙ ЦИКЛ ---
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

</script>
</body>
</html>
