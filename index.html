<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Photo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Убираем скроллбары */
            background-color: #151515;
            touch-action: none; /* Отключаем стандартные жесты браузера (зум, скролл) */
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Подключаем Three.js через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

<script type="module">
    import * as THREE from 'three';

    // --- 1. НАСТРОЙКА СЦЕНЫ ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#252527');

    // --- 2. КАМЕРА ---
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 40);

    // --- 3. РЕНДЕРЕР ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 4. ОСВЕЩЕНИЕ ---
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(-5, 10, 10); 
    scene.add(light);
    
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // --- 5. ЗАГРУЗКА ФОТО ---
    
    // ВАЖНО: Ссылка на файл рядом
    const imageSource = './photo.jpg'; 
    
    const textureLoader = new THREE.TextureLoader();
    const photoNode = new THREE.Group();
    scene.add(photoNode);

    textureLoader.load(
        imageSource,
        (texture) => {
            const imgWidth = texture.image.width;
            const imgHeight = texture.image.height;
            const aspectRatio = imgWidth / imgHeight;

            const h = 15.0;
            const w = h * aspectRatio;
            const d = 0.5;

            texture.colorSpace = THREE.SRGBColorSpace;

            const sideMaterial = new THREE.MeshStandardMaterial({ 
                map: texture, 
                roughness: 0.8,
                color: 0xffffff
            });

            const faceMaterial = new THREE.MeshStandardMaterial({ 
                map: texture, 
                roughness: 0.2,
                color: 0xffffff
            });

            const materials = [
                sideMaterial, // Right
                sideMaterial, // Left
                sideMaterial, // Top
                sideMaterial, // Bottom
                faceMaterial, // Front
                faceMaterial  // Back
            ];

            const geometry = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geometry, materials);
            photoNode.add(mesh);
        },
        undefined, 
        (err) => { console.error('Ошибка загрузки текстуры', err); }
    );

    // --- 6. УПРАВЛЕНИЕ (МЫШЬ + СЕНСОР) ---
    
    let isDragging = false;
    let lastPos = { x: 0, y: 0 };

    // === ДЛЯ КОМПЬЮТЕРА (МЫШЬ) ===
    window.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        handleMove(e.clientX, e.clientY);
    });

    // === ДЛЯ ТЕЛЕФОНА (ТАЧСКРИН) ===
    window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) { // Если касание одним пальцем
            isDragging = true;
            lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    }, { passive: false });

    window.addEventListener('touchend', () => {
        isDragging = false;
    });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        // preventDefault отключает прокрутку страницы браузером
        e.preventDefault(); 
        
        // Берем координаты первого пальца
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
    }, { passive: false });

    // === ОБЩАЯ ЛОГИКА ВРАЩЕНИЯ ===
    function handleMove(currentX, currentY) {
        const dx = currentX - lastPos.x;
        const dy = currentY - lastPos.y;

        const sensitivity = 0.01;
        
        photoNode.rotation.y += dx * sensitivity;
        photoNode.rotation.x += dy * sensitivity;

        lastPos = { x: currentX, y: currentY };
    }

    // === ЗУМ КОЛЕСИКОМ (ТОЛЬКО ПК) ===
    window.addEventListener('wheel', (e) => {
        const zoomSpeed = 0.05;
        let newZ = camera.position.z + (e.deltaY * zoomSpeed);
        if (newZ < 10) newZ = 10;
        if (newZ > 100) newZ = 100;
        camera.position.z = newZ;
    });

    // Изменение размера окна
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. АНИМАЦИЯ ---
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

</script>
</body>
</html>
